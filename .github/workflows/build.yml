name: Build AURA
on:
  push:
    tags:
      - 'v*'
jobs:
  # AURA's checks (the tests folder). If any fail, the builds below don't run and no release is made.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install the browser the window check uses
        run: npx playwright install --with-deps chromium
      - name: Run AURA's checks
        run: npm test
  build-windows:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build and Publish Windows
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}
  build-linux:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot
      - name: Build and Publish Linux
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}