name: Build AURA
on:
  push:
    tags:
      - 'v*'
# The release process (Added by aura-release-process-setup.cjs):
#   1. AURA's checks run on Linux and on Windows. If any fail, nothing is built.
#   2. The installers are built from the exact package versions in package-lock.json (npm ci).
#   3. The Windows installer is installed and AURA started once, to check it opens with no errors.
#   4. The release is published as a DRAFT. Nobody gets it until you press "Publish release" on GitHub.
jobs:
  # AURA's checks (the tests folder) on Linux
  test:
    runs-on: ubuntu-24.04   # pinned: GitHub is moving ubuntu-latest to a new Ubuntu (Added by aura-ci-fix-setup.cjs)
    timeout-minutes: 30   # GitHub stops the job after this, instead of waiting for hours (more time: Added by aura-checks-time-setup.cjs)
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund   # exact versions; the checks don't need the Electron program
      - name: Get FFmpeg for the media and clip checks   # (Added by aura-ci-ffmpeg-setup.cjs)
        run: node node_modules/ffmpeg-static/install.js
        timeout-minutes: 5
        continue-on-error: true   # if it can't be fetched, those checks are skipped instead of failing
      - name: Install the browser the window check uses
        run: npx playwright install chromium
        timeout-minutes: 5
        continue-on-error: true   # if this can't be fetched, the check uses the Chrome already on GitHub's machine
      - name: Run AURA's checks
        run: npm test
  # The same checks on Windows, where AURA really runs (sound devices, game detection, Xbox, paths)
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Get FFmpeg for the media and clip checks
        run: node node_modules/ffmpeg-static/install.js
        timeout-minutes: 5
        continue-on-error: true
      - name: Install the browser the window check uses
        run: npx playwright install chromium
        timeout-minutes: 5
        continue-on-error: true
      - name: Run AURA's checks
        run: npm test
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45   # GitHub stops the job after this, instead of waiting for hours
    needs: [test, test-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows and upload to the draft release
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install the new AURA and check it starts
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\AURA-Installer-*.exe | Select-Object -First 1
          if (-not $installer) { throw "The installer wasn't built" }
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          Stop-Process -Name aura -Force -ErrorAction SilentlyContinue   # in case the installer started it
          Start-Sleep -Seconds 2
          $app = Join-Path $env:LOCALAPPDATA "Programs\aura\aura.exe"
          if (-not (Test-Path $app)) { throw "AURA wasn't installed where expected: $app" }
          $p = Start-Process $app -ArgumentList "--aura-smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "AURA didn't finish its start-up check within 2 minutes" }
          $result = Join-Path $env:APPDATA "aura\smoke-test.txt"
          if (Test-Path $result) { Get-Content $result } else { "AURA wrote no result" }
          if ($p.ExitCode -ne 0) { throw "AURA's start-up check failed (see above)" }
  # The Microsoft Store package (.appx), uploaded to the same draft release. Runs after the Windows
  # installer is built, and on its own: if it fails, the normal installers are already out.
  # (Added by aura-store-setup.cjs)
  build-store:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the Microsoft Store package and upload to the draft release
        run: npm run electron:build:store
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check what's inside the Store package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\AURA-Store-*.appx | Select-Object -First 1
          if (-not $pkg) { throw "The Store package wasn't built" }
          Copy-Item $pkg.FullName pkg.zip
          Expand-Archive pkg.zip -DestinationPath pkg -Force
          [xml]$m = Get-Content pkg\AppxManifest.xml
          $id = $m.Package.Identity
          "Identity: $($id.Name)  $($id.Publisher)  version $($id.Version)"
          if ($id.Name -ne "TraylorDigital.AuraGamingHub") { throw "Wrong package name: $($id.Name)" }
          if ($id.Publisher -ne "CN=E6B56AB7-1B45-4740-A412-E234538BDD63") { throw "Wrong publisher: $($id.Publisher)" }
          $text = Get-Content pkg\AppxManifest.xml -Raw
          foreach ($need in @('runFullTrust', 'Name="microphone"', 'Name="webcam"', 'Name="internetClient"', 'TaskId="AuraGamingHubStartup" Enabled="false"', 'Executable="app\aura.exe"')) {
            if (-not $text.Contains($need)) { throw "The package is missing: $need" }
          }
          if (-not (Test-Path pkg\app\aura.exe)) { throw "aura.exe isn't in the package" }
          if (-not (Test-Path pkg\app\resources\THIRD-PARTY-NOTICES.md)) { throw "THIRD-PARTY-NOTICES.md isn't in the package" }
          "The Store package looks right: $($pkg.Name), $([math]::Round($pkg.Length / 1MB)) MB"

  build-linux:
    runs-on: ubuntu-24.04   # pinned: GitHub is moving ubuntu-latest to a new Ubuntu (Added by aura-ci-fix-setup.cjs)
    timeout-minutes: 45   # GitHub stops the job after this, instead of waiting for hours
    needs: [test, test-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot
      - name: Build Linux and upload to the draft release
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}
