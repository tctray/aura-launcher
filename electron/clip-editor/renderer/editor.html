<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src 'self' file:; img-src 'self' data: file:; style-src 'self'; script-src 'self'" />
  <title>Clip editor</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header class="topbar">
    <h1>Clip editor</h1>
    <div class="topbar-actions">
      <button id="btn-add" class="btn">Add clips</button>
      <button id="btn-export" class="btn btn-primary" disabled>Export</button>
    </div>
  </header>

  <main class="workspace">
    <section class="viewer">
      <div class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage">
        <video id="video" preload="auto" playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="empty" id="empty">
          <p>Add a recording to start editing.</p>
          <button id="btn-add-empty" class="btn btn-primary">Add clips</button>
        </div>
      </div>
      </div>

      <div class="transport">
        <button id="btn-play" class="icon-btn" aria-label="Play" disabled>
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <span class="time"><span id="time-current">0:00.0</span> / <span id="time-total">0:00.0</span></span>
        <button id="btn-split" class="btn btn-small" disabled title="Split the clip at the playhead (S)">Split</button>
        <button id="btn-add-text" class="btn btn-small" disabled title="Add text at the playhead (T)">Add text</button>
        <button id="btn-add-image" class="btn btn-small" disabled title="Add an image at the playhead (I)">Add image</button>
      </div>
    </section>

    <aside class="inspector" id="inspector">
      <form id="project-panel" class="panel">
        <h2>Whole video</h2>
        <div class="row">
          <label>Fade in (s) <input type="number" id="fade-in" step="0.1" min="0" max="5" value="0" /></label>
          <label>Fade out (s) <input type="number" id="fade-out" step="0.1" min="0" max="5" value="0" /></label>
        </div>
        <p class="hint">Select a clip, text or image on the timeline to edit it.</p>
      </form>

      <form id="clip-panel" class="panel" hidden>
        <h2 id="clip-name">Clip</h2>
        <label>Start in source <span class="value" id="clip-in-val"></span>
          <input type="range" id="clip-in" step="0.01" />
        </label>
        <label>End in source <span class="value" id="clip-out-val"></span>
          <input type="range" id="clip-out" step="0.01" />
        </label>
        <p class="meta" id="clip-meta"></p>
        <h3>Effects</h3>
        <label>Look
          <select id="fx-preset">
            <option value="none">None</option>
            <option value="bw">Black &amp; white</option>
            <option value="sepia">Sepia</option>
            <option value="vivid">Vivid</option>
            <option value="vignette">Vignette</option>
          </select>
        </label>
        <label>Brightness <input type="range" id="fx-brightness" min="-0.3" max="0.3" step="0.01" /></label>
        <label>Contrast <input type="range" id="fx-contrast" min="0.5" max="1.5" step="0.01" /></label>
        <label>Saturation <input type="range" id="fx-saturation" min="0" max="2" step="0.01" /></label>
        <div class="row">
          <button type="button" class="btn btn-small" id="fx-reset">Reset effects</button>
          <button type="button" class="btn btn-small" id="fx-all">Apply to all clips</button>
        </div>
        <h3>Clip</h3>
        <div class="row">
          <button type="button" class="btn btn-small" id="clip-left">Move left</button>
          <button type="button" class="btn btn-small" id="clip-right">Move right</button>
          <button type="button" class="btn btn-small btn-danger" id="clip-delete">Remove</button>
        </div>
      </form>

      <form id="text-panel" class="panel" hidden>
        <h2>Text</h2>
        <label>Text <input type="text" id="text-value" maxlength="120" /></label>
        <div class="row">
          <label>Show from (s) <input type="number" id="text-start" step="0.1" min="0" /></label>
          <label>Until (s) <input type="number" id="text-end" step="0.1" min="0" /></label>
        </div>
        <label>Size <input type="range" id="text-size" min="0.03" max="0.2" step="0.005" /></label>
        <label>Colour <input type="color" id="text-color" /></label>
        <p class="meta">Drag the text in the preview to move it.</p>
        <button type="button" class="btn btn-small btn-danger" id="text-delete">Remove text</button>
      </form>

      <form id="image-panel" class="panel" hidden>
        <h2 id="image-name">Image</h2>
        <div class="row">
          <label>Show from (s) <input type="number" id="image-start" step="0.1" min="0" /></label>
          <label>Until (s) <input type="number" id="image-end" step="0.1" min="0" /></label>
        </div>
        <label>Size <input type="range" id="image-scale" min="0.05" max="1" step="0.01" /></label>
        <label>Opacity <input type="range" id="image-opacity" min="0.1" max="1" step="0.01" /></label>
        <p class="meta">Drag the image in the preview to move it.</p>
        <button type="button" class="btn btn-small btn-danger" id="image-delete">Remove image</button>
      </form>
    </aside>
  </main>

  <section class="timeline" id="timeline">
    <div class="ruler" id="ruler"></div>
    <div class="track" id="track-clips"></div>
    <div class="track track-text" id="track-text"></div>
    <div class="track track-text" id="track-img"></div>
    <div class="playhead" id="playhead"></div>
  </section>

  <dialog id="export-dialog">
    <form method="dialog" id="export-form">
      <h2>Export</h2>
      <fieldset>
        <legend>Format</legend>
        <label class="choice"><input type="radio" name="format" value="mp4" checked /> MP4 video</label>
        <label class="choice"><input type="radio" name="format" value="gif" /> GIF (no sound)</label>
      </fieldset>

      <div id="mp4-options">
        <label>Resolution
          <select name="resolution">
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
          </select>
        </label>
        <label>Frame rate
          <select name="fps">
            <option value="60">60 fps</option>
            <option value="30">30 fps</option>
          </select>
        </label>
        <label>File size
          <select name="quality">
            <option value="high">Larger, best quality</option>
            <option value="balanced" selected>Balanced</option>
            <option value="small">Smaller, for sharing on Discord</option>
          </select>
        </label>
      </div>

      <div id="gif-options" hidden>
        <label>Width
          <select name="gifWidth">
            <option value="320">320 px</option>
            <option value="480" selected>480 px</option>
            <option value="640">640 px</option>
          </select>
        </label>
        <label>Frame rate
          <select name="gifFps">
            <option value="10">10 fps</option>
            <option value="15" selected>15 fps</option>
            <option value="24">24 fps</option>
          </select>
        </label>
        <p class="meta" id="gif-warning"></p>
      </div>

      <div class="progress" id="export-progress" hidden>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-label">0%</span>
      </div>
      <p class="status" id="export-status" role="status"></p>

      <div class="row row-end">
        <button type="button" class="btn" id="export-close">Close</button>
        <button type="button" class="btn" id="export-cancel" hidden>Cancel export</button>
        <button type="button" class="btn btn-primary" id="export-start">Choose location and export</button>
      </div>
    </form>
  </dialog>

  <script src="editor.js"></script>
</body>
</html>
